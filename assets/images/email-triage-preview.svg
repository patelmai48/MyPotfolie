  <!-- Flow Steps -->
  <rect x="85" y="155" width="240" height="42" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="100" y="180" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📥 1. Gmail API Ingestion</text>

  <rect x="85" y="210" width="240" height="42" rx="6" fill="#16221D" stroke="#10B981" stroke-opacity="0.5"/>
