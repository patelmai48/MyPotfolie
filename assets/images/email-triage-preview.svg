<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F0D"/>
      <stop offset="100%" stop-color="#121A16"/>
    </linearGradient>
    <linearGradient id="emeraldGradAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="cardGradAI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15211B"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradAI)"/>
  <rect x="1" y="1" width="798" height="498" rx="12" fill="none" stroke="#24332B" stroke-width="2"/>

  <!-- Window Container -->
  <rect x="40" y="35" width="720" height="430" rx="12" fill="url(#cardGradAI)" stroke="#24332B" stroke-width="1.5"/>
