  <line x1="380" y1="214" x2="715" y2="214" stroke="#24332B" stroke-width="0.8"/>

  <!-- Row 2 -->
  <text x="390" y="240" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Software Intern Interview</text>
  <rect x="555" y="228" width="65" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="568" y="240" fill="#6EE7B7" font-size="9" font-weight="bold">HIGH PRIO</text>
  <text x="660" y="240" fill="#6EE7B7" font-size="10">Slack Ping 🔔</text>
  <line x1="380" y1="256" x2="715" y2="256" stroke="#24332B" stroke-width="0.8"/>

  <!-- Row 3 -->
  <text x="390" y="282" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Weekly Tech Newsletter</text>
  <rect x="555" y="270" width="65" height="16" rx="8" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="573" y="282" fill="#60A5FA" font-size="9" font-weight="bold">INFO</text>
  <text x="660" y="282" fill="#A7B0AA" font-size="10">Archived 📁</text>
  <line x1="380" y1="298" x2="715" y2="298" stroke="#24332B" stroke-width="0.8"/>

  <!-- Row 4 -->
  <text x="390" y="324" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Cloud Bill Notification</text>
  <rect x="555" y="312" width="65" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="566" y="324" fill="#FBBF24" font-size="9" font-weight="bold">MEDIUM</text>
  <text x="660" y="324" fill="#A7B0AA" font-size="10">Logged 💾</text>
  <line x1="380" y1="340" x2="715" y2="340" stroke="#24332B" stroke-width="0.8"/>

  <!-- Row 5 -->
  <text x="390" y="366" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">GitHub Security Advisory</text>
  <rect x="555" y="354" width="65" height="16" rx="8" fill="#EF4444" fill-opacity="0.2"/>
  <text x="565" y="366" fill="#F87171" font-size="9" font-weight="bold">CRITICAL</text>
  <text x="660" y="366" fill="#6EE7B7" font-size="10">Slack Ping 🔔</text>

  <!-- Summary bottom bar -->
  <rect x="380" y="390" width="335" height="30" rx="4" fill="#16221D"/>
  <text x="395" y="410" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">⚡ Filtered 48 emails • 0 false positives</text>
</svg>
