  <rect x="85" y="265" width="240" height="42" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="100" y="290" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💾 3. SQLite Storage &amp; Logs</text>

  <rect x="85" y="320" width="240" height="42" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="100" y="345" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔔 4. Slack Webhook Alerts</text>

