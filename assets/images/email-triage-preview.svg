  <line x1="40" y1="80" x2="760" y2="80" stroke="#24332B" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="65" cy="58" r="6" fill="#FF5F56"/>
  <circle cx="85" cy="58" r="6" fill="#FFBD2E"/>
  <circle cx="105" cy="58" r="6" fill="#27C93F"/>
  <text x="130" y="63" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">AI Email Triage Agent • Automated Gmail &amp; Slack Pipeline</text>

