<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F0D"/>
      <stop offset="100%" stop-color="#121A16"/>
    </linearGradient>
    <linearGradient id="emeraldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16231C"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  <rect x="1" y="1" width="798" height="498" rx="12" fill="none" stroke="#24332B" stroke-width="2"/>

  <!-- Window Container -->
  <rect x="120" y="45" width="560" height="410" rx="14" fill="url(#cardGrad3)" stroke="#24332B" stroke-width="1.5"/>
  <path d="M120 45 h560 v45 h-560 z" fill="#121A16"/>
  <line x1="120" y1="90" x2="680" y2="90" stroke="#24332B" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="145" cy="68" r="6" fill="#FF5F56"/>
  <circle cx="165" cy="68" r="6" fill="#FFBD2E"/>
  <circle cx="185" cy="68" r="6" fill="#27C93F"/>
  <text x="210" y="73" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Secure Password Generator • Cryptographic Utility</text>

  <!-- Output Display Box -->
  <rect x="160" y="120" width="480" height="60" rx="8" fill="#0B0F0D" stroke="#10B981" stroke-width="1.5"/>
  <text x="185" y="157" fill="#6EE7B7" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" letter-spacing="2">v8$K!9#mP@2026&amp;qZ</text>
  <!-- Copy Button -->
  <rect x="540" y="132" width="85" height="36" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="560" y="155" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📋 Copy</text>

  <!-- Strength Meter -->
  <text x="160" y="210" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Security Strength</text>
  <text x="590" y="210" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">VERY STRONG</text>
  
  <rect x="160" y="222" width="115" height="8" rx="4" fill="#10B981"/>
  <rect x="282" y="222" width="115" height="8" rx="4" fill="#10B981"/>
  <rect x="404" y="222" width="115" height="8" rx="4" fill="#10B981"/>
  <rect x="526" y="222" width="114" height="8" rx="4" fill="#6EE7B7"/>

  <!-- Character Length Slider -->
  <text x="160" y="270" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Password Length</text>
  <text x="615" y="270" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">18</text>
  <rect x="160" y="285" width="480" height="6" rx="3" fill="#24332B"/>
  <rect x="160" y="285" width="310" height="6" rx="3" fill="url(#emeraldGrad3)"/>
  <circle cx="470" cy="288" r="9" fill="#6EE7B7" stroke="#0B0F0D" stroke-width="2"/>

  <!-- Customization Checkboxes -->
  <!-- Check 1 -->
  <rect x="160" y="325" width="225" height="40" rx="6" fill="#0B0F0D" stroke="#24332B"/>
  <rect x="175" y="337" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="179" y="350" fill="#0B0F0D" font-size="12" font-weight="bold">✓</text>
  <text x="202" y="350" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Uppercase Letters (A-Z)</text>

  <!-- Check 2 -->
  <rect x="415" y="325" width="225" height="40" rx="6" fill="#0B0F0D" stroke="#24332B"/>
  <rect x="430" y="337" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="434" y="350" fill="#0B0F0D" font-size="12" font-weight="bold">✓</text>
  <text x="457" y="350" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Lowercase Letters (a-z)</text>

  <!-- Check 3 -->
  <rect x="160" y="375" width="225" height="40" rx="6" fill="#0B0F0D" stroke="#24332B"/>
  <rect x="175" y="387" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="179" y="400" fill="#0B0F0D" font-size="12" font-weight="bold">✓</text>
  <text x="202" y="400" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Include Numbers (0-9)</text>

  <!-- Check 4 -->
  <rect x="415" y="375" width="225" height="40" rx="6" fill="#0B0F0D" stroke="#24332B"/>
  <rect x="430" y="387" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="434" y="400" fill="#0B0F0D" font-size="12" font-weight="bold">✓</text>
  <text x="457" y="400" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Special Symbols (!@#$)</text>
</svg>
