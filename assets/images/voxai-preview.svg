<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F0D"/>
      <stop offset="100%" stop-color="#121A16"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16221D"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="498" rx="12" fill="none" stroke="#24332B" stroke-width="2"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#10B981" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="430" rx="12" fill="url(#cardGrad)" stroke="#24332B" stroke-width="1.5"/>
  <path d="M40 35 h720 v45 h-720 z" fill="#121A16"/>
  <line x1="40" y1="80" x2="760" y2="80" stroke="#24332B" stroke-width="1"/>
  
  <!-- Window controls -->
  <circle cx="65" cy="58" r="6" fill="#FF5F56"/>
  <circle cx="85" cy="58" r="6" fill="#FFBD2E"/>
  <circle cx="105" cy="58" r="6" fill="#27C93F"/>
  <text x="130" y="63" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">VoxAI Studio • AI Text-to-Speech Engine</text>

  <!-- Live Status Badge -->
  <rect x="630" y="50" width="105" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <circle cx="645" cy="61" r="3.5" fill="#10B981"/>
  <text x="655" y="65" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AI ACTIVE</text>

  <!-- Left Column: Input text area -->
  <rect x="70" y="105" width="390" height="230" rx="8" fill="#0B0F0D" stroke="#24332B" stroke-width="1"/>
  <text x="90" y="135" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Input Script</text>
  <text x="90" y="165" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" line-height="1.5">
    <tspan x="90" dy="0">"Welcome to VoxAI Studio. Transform your written text</tspan>
    <tspan x="90" dy="24">into ultra-realistic, natural voice synthesis with deep</tspan>
    <tspan x="90" dy="24">neural network modeling and multi-language controls."</tspan>
  </text>
  <rect x="90" y="275" width="130" height="38" rx="6" fill="url(#emeraldGrad)"/>
  <text x="115" y="299" fill="#0B0F0D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Synthesize Voice</text>

  <!-- Right Column: Settings & Waveform -->
  <rect x="480" y="105" width="250" height="230" rx="8" fill="#0B0F0D" stroke="#24332B" stroke-width="1"/>
  <text x="500" y="135" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Voice Configuration</text>

  <!-- Voice Select Pill -->
  <rect x="500" y="150" width="210" height="34" rx="6" fill="#121A16" stroke="#24332B"/>
  <text x="515" y="172" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Neural Voice: Aria (Natural)</text>

  <!-- Sliders -->
  <text x="500" y="210" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pitch: 1.0x</text>
  <rect x="500" y="218" width="210" height="4" rx="2" fill="#24332B"/>
  <rect x="500" y="218" width="130" height="4" rx="2" fill="#10B981"/>
  <circle cx="630" cy="220" r="6" fill="#6EE7B7"/>

  <text x="500" y="250" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Speed: 1.2x</text>
  <rect x="500" y="258" width="210" height="4" rx="2" fill="#24332B"/>
  <rect x="500" y="258" width="150" height="4" rx="2" fill="#10B981"/>
  <circle cx="650" cy="260" r="6" fill="#6EE7B7"/>

  <!-- Audio Waveform Player Bar -->
  <rect x="70" y="355" width="660" height="85" rx="8" fill="#0B0F0D" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="115" cy="397" r="22" fill="url(#emeraldGrad)"/>
  <!-- Play Icon -->
  <polygon points="110,387 125,397 110,407" fill="#0B0F0D"/>
  
