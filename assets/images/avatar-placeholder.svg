<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16241E"/>
      <stop offset="100%" stop-color="#0E1713"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Outer Circle -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#avatarGrad)" stroke-width="3" filter="url(#emeraldGlow)" opacity="0.7"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#avatarGrad)" stroke-width="2"/>

  <!-- Inner Dark Circle -->
  <circle cx="250" cy="250" r="175" fill="url(#avatarBg)"/>

  <!-- Subtle Geometric Grid Accent -->
  <g opacity="0.15" stroke="#6EE7B7" stroke-width="1">
    <circle cx="250" cy="250" r="130" fill="none"/>
    <circle cx="250" cy="250" r="80" fill="none"/>
    <line x1="120" y1="250" x2="380" y2="250"/>
    <line x1="250" y1="120" x2="250" y2="380"/>
  </g>

  <!-- Developer Monogram / Icon Area -->
  <g transform="translate(250, 230)">
    <!-- Monogram Circle Badge -->
    <circle cx="0" cy="0" r="65" fill="#0B0F0D" stroke="#24332B" stroke-width="2"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Code Monogram -->
    <text x="0" y="12" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1">MP</text>
  </g>

  <!-- Title Pill below -->
  <g transform="translate(250, 340)">
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0B0F0D" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="-75" cy="0" r="4" fill="#10B981"/>
    <text x="-62" y="5" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Full-Stack Developer</text>
  </g>

  <!-- Floating Tech Icons Around Avatar -->
  <!-- Top Right: React/JS Symbol -->
  <g transform="translate(380, 140)">
    <circle cx="0" cy="0" r="22" fill="#121A16" stroke="#24332B" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#6EE7B7" font-family="'Courier New', monospace" font-size="14" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Bottom Left: Python/DB Symbol -->
  <g transform="translate(120, 360)">
    <circle cx="0" cy="0" r="22" fill="#121A16" stroke="#24332B" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#10B981" font-size="14">⚡</text>
  </g>

  <!-- Top Left: AI Symbol -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="0" r="22" fill="#121A16" stroke="#24332B" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#6EE7B7" font-size="13">✦</text>
  </g>
</svg>
