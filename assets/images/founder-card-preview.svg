      <text x="12" y="20" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">TRACTION</text>
      <text x="12" y="38" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">$2.4M ARR</text>

      <!-- Metric 2 -->
