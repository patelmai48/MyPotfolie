    <text x="24" y="334" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">⚡ Instant Stale-While-Revalidate Sync</text>
    <text x="270" y="334" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Card #01 / 24</text>
