    <text x="26" y="84" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Status: <tspan fill="#6EE7B7">Success (Fresh)</tspan></text>
    <text x="26" y="99" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Cache Time: 5 mins • Latency: 12ms</text>

    <!-- Architecture Features -->
    <text x="20" y="132" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Component Highlights</text>

    <!-- Feature 1 -->
    <rect x="15" y="144" width="245" height="36" rx="6" fill="#121B16" stroke="#24332B"/>
    <circle cx="30" cy="162" r="4" fill="#10B981"/>
    <text x="44" y="166" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Optimistic UI Upvotes &amp; Saves</text>

    <!-- Feature 2 -->
    <rect x="15" y="188" width="245" height="36" rx="6" fill="#121B16" stroke="#24332B"/>
    <circle cx="30" cy="206" r="4" fill="#10B981"/>
    <text x="44" y="210" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Tailwind Glassmorphic Grids</text>

    <!-- Feature 3 -->
    <rect x="15" y="232" width="245" height="36" rx="6" fill="#121B16" stroke="#24332B"/>
    <circle cx="30" cy="250" r="4" fill="#10B981"/>
    <text x="44" y="254" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Auto Prefetching &amp; Lazy Load</text>

    <!-- Feature 4 -->
    <rect x="15" y="276" width="245" height="36" rx="6" fill="#121B16" stroke="#24332B"/>
    <circle cx="30" cy="294" r="4" fill="#10B981"/>
    <text x="44" y="298" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Fully Mobile &amp; Desktop Tested</text>

