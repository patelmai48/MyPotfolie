      <text x="76" y="15" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">TanStack</text>

      <rect x="152" y="0" width="70" height="22" rx="4" fill="#1D2A23"/>
      <text x="160" y="15" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Tailwind</text>

