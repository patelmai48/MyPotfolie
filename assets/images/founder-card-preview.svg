    <path d="M72 68 L75 71 L81 64" fill="none" stroke="#0B0F0D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Founder Details -->
    <text x="100" y="44" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Sarah Jenkins</text>
    <text x="100" y="62" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Founder &amp; CEO @ NexaAI</text>
    <text x="100" y="78" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">San Francisco, CA • Serial Founder (Y-Combinator)</text>

