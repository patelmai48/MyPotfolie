  <circle cx="85" cy="51" r="5.5" fill="#FFBD2E"/>
  <circle cx="105" cy="51" r="5.5" fill="#27C93F"/>
  <text x="130" y="55" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Founder Recommendation Card • Next.js &amp; TanStack Query</text>

