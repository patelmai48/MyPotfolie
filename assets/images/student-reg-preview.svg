  <rect x="90" y="398" width="180" height="30" rx="6" fill="url(#emeraldGradReg)"/>
  <text x="115" y="418" fill="#0B0F0D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">✓ Register Student</text>

  <!-- Right Column: Verification & Database sync -->
  <rect x="500" y="105" width="230" height="335" rx="8" fill="#0B0F0D" stroke="#24332B" stroke-width="1"/>
  <text x="520" y="132" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Validation &amp; Storage</text>

  <rect x="520" y="155" width="190" height="60" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="535" y="178" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Client Validation</text>
  <text x="535" y="198" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Regex format check passed</text>

  <rect x="520" y="230" width="190" height="60" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="535" y="253" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 Flask Server Auth</text>
  <text x="535" y="273" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Sanitized input &amp; CSRF ok</text>

  <rect x="520" y="305" width="190" height="60" rx="6" fill="#16221D" stroke="#24332B"/>
  <text x="535" y="328" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💾 SQLite Database</text>
  <text x="535" y="348" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Record committed (#1042)</text>

  <rect x="520" y="380" width="190" height="40" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="535" y="405" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Status: 201 Created</text>
</svg>
