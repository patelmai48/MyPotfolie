  <rect x="70" y="105" width="410" height="335" rx="8" fill="#0B0F0D" stroke="#24332B" stroke-width="1"/>
  <text x="90" y="132" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">New Student Intake Form</text>

  <!-- Field 1: Full Name -->
  <text x="90" y="160" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Student Full Name *</text>
  <rect x="90" y="168" width="370" height="32" rx="6" fill="#121A16" stroke="#10B981" stroke-width="1.2"/>
  <text x="105" y="189" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Aarav Sharma</text>
  <text x="440" y="189" fill="#10B981" font-size="12">✓</text>

  <!-- Field 2: Email -->
  <text x="90" y="222" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Academic Email *</text>
  <rect x="90" y="230" width="370" height="32" rx="6" fill="#121A16" stroke="#24332B"/>
  <text x="105" y="251" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">aarav.sharma@jguniv.edu.in</text>
  <text x="440" y="251" fill="#10B981" font-size="12">✓</text>

  <!-- Field 3 & 4 (2 columns) -->
  <text x="90" y="284" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Program / Degree</text>
  <rect x="90" y="292" width="175" height="32" rx="6" fill="#121A16" stroke="#24332B"/>
  <text x="105" y="313" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Integrated M.Sc. IT</text>

  <text x="285" y="284" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Admission Year</text>
  <rect x="285" y="292" width="175" height="32" rx="6" fill="#121A16" stroke="#24332B"/>
  <text x="300" y="313" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Batch 2024–2029</text>

  <!-- Field 5: Phone -->
  <text x="90" y="346" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Contact Number</text>
