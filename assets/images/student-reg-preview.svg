<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradReg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F0D"/>
      <stop offset="100%" stop-color="#121A16"/>
    </linearGradient>
    <linearGradient id="emeraldGradReg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="cardGradReg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16231C"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradReg)"/>
  <rect x="1" y="1" width="798" height="498" rx="12" fill="none" stroke="#24332B" stroke-width="2"/>

  <!-- Window Container -->
  <rect x="40" y="35" width="720" height="430" rx="12" fill="url(#cardGradReg)" stroke="#24332B" stroke-width="1.5"/>
  <path d="M40 35 h720 v45 h-720 z" fill="#121A16"/>
  <line x1="40" y1="80" x2="760" y2="80" stroke="#24332B" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="65" cy="58" r="6" fill="#FF5F56"/>
  <circle cx="85" cy="58" r="6" fill="#FFBD2E"/>
  <circle cx="105" cy="58" r="6" fill="#27C93F"/>
  <text x="130" y="63" fill="#A7B0AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Student Registration Portal • Intake &amp; Validation System</text>

  <!-- Live Status Badge -->
  <rect x="625" y="50" width="110" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
